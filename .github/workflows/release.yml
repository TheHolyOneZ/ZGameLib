name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Choose build config
        id: cfg
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Updater signing key found: updater artifacts will be signed."
          else
            echo '{ "bundle": { "createUpdaterArtifacts": false } }' > src-tauri/tauri.ci.conf.json
            echo "args=--config src-tauri/tauri.ci.conf.json" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set. Building without updater artifacts."
          fi

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: ${{ steps.cfg.outputs.args }}
          tagName: v__VERSION__
          releaseName: ZGameLib v__VERSION__
          releaseBody: |
            ## ZGameLib v__VERSION__

            See [CHANGELOG.md](https://github.com/TheHolyOneZ/ZGameLib/blob/main/CHANGELOG.md) for everything in this release.

            **Download:** the `.msi` (recommended) or `-setup.exe` file below.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
